name: publish to pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate tag matches version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # handles v0.3.0 and v.0.3.0
          TAG_VERSION=$(echo "$TAG" | sed -E 's/^v\.?//')
          PKG_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\\']([^\"\\']+)', open('bannerforge/__init__.py').read()).group(1))")
          echo "tag: $TAG_VERSION"
          echo "pkg: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bannerforge/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
